[package]
name = "ats-cv-studio"
version = "1.3.0"
description = "ATS CV Studio - offline-first ATS-safe CV builder"
authors = ["ATS CV Studio"]
edition = "2021"

[lib]
name = "ats_cv_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
