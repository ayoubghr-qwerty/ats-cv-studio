name: Release

# Builds the three Windows deliverables:
#   1. MSI installer
#   2. NSIS installer (setup .exe)
#   3. Portable ZIP (exe + portable.json, data stored in ATSData/ next to the exe)
#
# Triggers:
#   - push of a tag such as v1.3.0  -> builds, then creates a DRAFT GitHub release
#   - manual run (Actions tab)      -> builds and uploads the files as a workflow artifact only

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check versions (tag build)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-versions.mjs --expect "${{ github.ref_name }}"

      - name: Check versions (manual build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: node scripts/check-versions.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Runs `tauri build` once: it produces the MSI, the NSIS installer and the
      # raw exe, and the script copies the exe to release/portable/windows/.
      - name: Build installers and portable exe
        run: node scripts/build-portable-windows.mjs

      - name: Collect deliverables
        run: |
          $ErrorActionPreference = "Stop"
          $version = node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version"
          $bundle = "desktop/src-tauri/target/release/bundle"
          $dist = "release/dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $msi)  { throw "MSI installer not found in $bundle/msi" }
          if (-not $nsis) { throw "NSIS installer not found in $bundle/nsis" }
          Copy-Item $msi.FullName  "$dist/ATS-CV-Studio_${version}_x64.msi"
          Copy-Item $nsis.FullName "$dist/ATS-CV-Studio_${version}_x64-setup.exe"

          $portable = "release/portable/windows"
          foreach ($f in @("ATS_CV_Studio_Portable.exe", "portable.json")) {
            if (-not (Test-Path "$portable/$f")) { throw "Portable file missing: $f" }
          }
          $stage = "release/stage/ATS-CV-Studio-Portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$portable/ATS_CV_Studio_Portable.exe" $stage
          Copy-Item "$portable/portable.json" $stage
          Compress-Archive -Path $stage -DestinationPath "$dist/ATS-CV-Studio_${version}_portable.zip" -Force

          Get-ChildItem $dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii

          Get-ChildItem $dist -File | Format-Table Name, Length
          Get-Content "$dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ats-cv-studio-windows
          path: release/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ATS CV Studio ${{ github.ref_name }}
          files: release/dist/*
          body: |
            Windows builds (unsigned: SmartScreen may warn on first run).

            - `*_x64.msi` — MSI installer
            - `*_x64-setup.exe` — NSIS installer
            - `*_portable.zip` — portable version (unzip anywhere; data stays in `ATSData/` next to the exe)
            - `SHA256SUMS.txt` — checksums

            WebView2 runtime is required (preinstalled on Windows 11).
            Test with `docs/RELEASE-CHECKLIST.md` before publishing this draft.
